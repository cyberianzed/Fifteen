# Builds the Linux (Debian/Ubuntu) package on Linux and attaches it to a release as Fifteen-linux-amd64.deb.
# Runs when a release is published, or by hand (Actions → Linux .deb → Run workflow) for an existing tag.
name: Linux .deb

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the .deb to (e.g. v1.1.2)"
        required: true

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the .deb (public build: no Supabase keys inside)
        run: |
          chmod +x gradlew
          ./gradlew :composeApp:packageDeb "-Pfifteen.public=true" --no-daemon
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deb=$(find composeApp/build/compose/binaries -name '*.deb' | head -1)
          cp "$deb" Fifteen-linux-amd64.deb
          gh release upload "$TAG" Fifteen-linux-amd64.deb --clobber
